<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE4 (FCP) Study Hub PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap');

        :root {
            --primary: #ee3124; /* Fortinet Red */
            --secondary: #b71c1c; 
            --dark: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(238, 49, 36, 0.2);
            --correct: #27ae60;
            --wrong: #e74c3c;
            --text: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d1111, #121212);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 40px auto;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative;
        }

        h1, h2, h3 { margin-top: 0; font-weight: 600; }
        .text-center { text-align: center; }
        .text-primary { color: var(--primary); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .module-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .module-card:hover {
            background: rgba(238, 49, 36, 0.1);
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .module-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .module-stats {
            font-size: 14px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        
        .best-score { font-weight: bold; color: #2ecc71; }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(238, 49, 36, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            margin-top: 15px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .domain-badge {
            display: inline-block;
            background: rgba(238, 49, 36, 0.2);
            color: #ff5252;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        pre {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
            margin: 15px 0;
        }
        
        code {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: #00ff00;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .option-btn.correct { background: rgba(39, 174, 96, 0.2); border-color: var(--correct); color: #2ecc71; }
        .option-btn.wrong { background: rgba(231, 76, 60, 0.2); border-color: var(--wrong); color: #ff7675; }

        .explanation {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--primary);
            border-radius: 0 10px 10px 0;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        #dashboard-screen, #quiz-screen, #result-screen { display: none; }
        #dashboard-screen { display: block; }
        
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        
        .back-link {
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="dashboard-screen" class="glass-card">
        <div class="text-center">
            <h1 class="text-primary">FCP FortiGate Study Hub <span style="font-size: 14px; background: white; padding: 2px 6px; border-radius: 4px; color: var(--primary);">PRO</span></h1>
            <p>FortiOS 7.4 | ZTNA & SD-WAN | Weakness Targeting</p>
        </div>
        
        <button class="btn" onclick="startQuiz('All')" style="margin-top: 20px; padding: 15px;">🚀 Inizia Simulazione (Tutti i Domini)</button>

        <h3 style="margin-top: 40px; margin-bottom: 10px;">Domain Drills</h3>
        <div class="dashboard-grid" id="modules-container"></div>
        
        <button class="btn btn-outline" onclick="resetStats()" style="margin-top: 40px; width: auto; font-size: 12px; padding: 8px 15px;">Reset Dati (Scores & Weaknesses)</button>
    </div>

    <div id="quiz-screen" class="glass-card">
        <div class="header-nav">
            <a class="back-link" onclick="goHome()">&larr; Abbandona Test</a>
            <div id="domain-badge" class="domain-badge">Domain</div>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div style="color: #888; font-size: 14px; margin-bottom: 15px;">Domanda <span id="current-q">1</span> di <span id="total-q">10</span></div>
        
        <div id="question-text" class="question-text">Question?</div>
        
        <div id="options-grid" class="options-grid"></div>

        <div id="explanation" class="explanation">
            <strong>Spiegazione:</strong> <span id="exp-text"></span>
        </div>

        <button id="next-btn" class="btn" onclick="nextQuestion()" style="display: none; margin-top: 25px;">Prossima Domanda &rarr;</button>
    </div>

    <div id="result-screen" class="glass-card text-center">
        <h1 class="text-primary">Test Completato</h1>
        <h3 id="result-domain" style="color: #aaa;">Domain</h3>
        
        <div style="font-size: 60px; font-weight: bold; margin: 20px 0;">
            <span id="final-score" style="color: white;">0%</span>
        </div>
        <p id="result-msg" style="font-size: 16px; margin-bottom: 40px; color: #ccc;"></p>

        <button class="btn" onclick="goHome()">Torna alla Dashboard</button>
    </div>

</div>

<!-- INCLUSIONE DATABASE FORTINET -->
<script src="nse4_database.js"></script>

<script>
    const domains = [
        "System, Fabric & Automation",
        "Firewall Policies & NAT",
        "Routing & SD-WAN",
        "IPsec & SSL VPN",
        "Security Profiles & Inspection",
        "ZTNA & User Authentication"
    ];

    let currentMode = ""; 
    let activeQuizData = [];
    let currentQuestionIndex = 0;
    let score = 0;

    let stats = JSON.parse(localStorage.getItem("nse4_stats_pro")) || {};
    let weaknesses = JSON.parse(localStorage.getItem("nse4_weaknesses_pro")) || {};

    function initDashboard() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        domains.forEach(d => {
            const best = stats[d] !== undefined ? `${stats[d]}%` : '---';
            const card = document.createElement('div');
            card.className = 'module-card';
            card.onclick = () => startQuiz(d);
            card.innerHTML = `
                <div>
                    <div class="module-title">${d}</div>
                </div>
                <div class="module-stats" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                    <span>Best Score:</span>
                    <span class="best-score" style="color: ${stats[d] >= 80 ? '#2ecc71' : (stats[d] >= 60 ? '#f1c40f' : '#e74c3c')}">${best}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function applySpacedRepetition(questionsArray) {
        let enhancedPool = [];
        questionsArray.forEach(q => {
            enhancedPool.push(q);
            if (weaknesses[q.id]) {
                for(let i=0; i<weaknesses[q.id]; i++) {
                    enhancedPool.push(q);
                }
            }
        });
        return enhancedPool;
    }

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function startQuiz(mode) {
        if (typeof nse4Database === 'undefined') {
            alert("Errore: Il file nse4_database.js non è stato caricato. Assicurati che siano nella stessa cartella.");
            return;
        }

        currentMode = mode;
        score = 0;
        currentQuestionIndex = 0;
        
        let domainQuestions = (mode === "All") ? nse4Database : nse4Database.filter(q => q.domain === mode);
        
        let weightedPool = applySpacedRepetition(domainQuestions);
        weightedPool = shuffleArray(weightedPool);

        let finalSelection = [];
        let numQs = (mode === "All") ? 24 : Math.min(10, domainQuestions.length);
        
        for (let i = 0; i < weightedPool.length && finalSelection.length < numQs; i++) {
            if (!finalSelection.find(q => q.id === weightedPool[i].id)) {
                finalSelection.push(weightedPool[i]);
            }
        }
        activeQuizData = finalSelection;

        document.getElementById('dashboard-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        document.getElementById('domain-badge').innerText = mode === "All" ? "Full Simulation" : mode;
        document.getElementById('total-q').innerText = activeQuizData.length;
        
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeQuizData[currentQuestionIndex];
        document.getElementById('current-q').innerText = currentQuestionIndex + 1;
        document.getElementById('question-text').innerHTML = q.q;
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        const progress = (currentQuestionIndex / activeQuizData.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';

        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        let opts = q.options.map((text, index) => ({ text, isCorrect: (index === q.correct) }));
        opts = shuffleArray(opts);

        opts.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectAnswer(btn, opt.isCorrect, q);
            optionsGrid.appendChild(btn);
        });
    }

    function selectAnswer(btn, isCorrect, qObj) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        
        if (isCorrect) {
            btn.classList.add('correct');
            score++;
            if (weaknesses[qObj.id]) {
                weaknesses[qObj.id]--;
                if(weaknesses[qObj.id] <= 0) delete weaknesses[qObj.id];
            }
        } else {
            btn.classList.add('wrong');
            weaknesses[qObj.id] = (weaknesses[qObj.id] || 0) + 1;
            
            buttons.forEach(b => {
                let opts = qObj.options;
                if (b.innerText === opts[qObj.correct]) b.classList.add('correct');
            });
        }
        
        localStorage.setItem("nse4_weaknesses_pro", JSON.stringify(weaknesses));

        document.getElementById('exp-text').innerText = qObj.exp;
        document.getElementById('explanation').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
        
        if (currentQuestionIndex === activeQuizData.length - 1) {
            document.getElementById('next-btn').innerText = 'Vedi Risultati';
        } else {
            document.getElementById('next-btn').innerText = 'Prossima Domanda \u2192';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const percentage = Math.round((score / activeQuizData.length) * 100);
        
        document.getElementById('result-domain').innerText = currentMode === "All" ? "Full Simulation Completata" : `Drill: ${currentMode}`;
        
        const finalScoreEl = document.getElementById('final-score');
        finalScoreEl.innerText = percentage + '%';
        
        const msgEl = document.getElementById('result-msg');
        if (percentage >= 85) {
            finalScoreEl.style.color = '#2ecc71';
            msgEl.innerHTML = "Perfetto! Hai dimostrato di padroneggiare FortiOS su questi argomenti.";
        } else {
            finalScoreEl.style.color = '#e74c3c';
            msgEl.innerHTML = "C'è qualche lacuna. Fortunatamente l'algoritmo ha registrato gli errori e ti tornerà a testare su questi punti.";
        }

        if (currentMode !== "All") {
            const prevBest = stats[currentMode] || 0;
            if (percentage > prevBest) {
                stats[currentMode] = percentage;
                localStorage.setItem("nse4_stats_pro", JSON.stringify(stats));
            }
        }
    }

    function goHome() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        initDashboard(); 
    }

    function resetStats() {
        if(confirm("Vuoi cancellare lo storico e i dati sulle tue lacune?")) {
            localStorage.removeItem("nse4_stats_pro");
            localStorage.removeItem("nse4_weaknesses_pro");
            stats = {};
            weaknesses = {};
            initDashboard();
        }
    }

    initDashboard();
</script>
</body>
</html>
