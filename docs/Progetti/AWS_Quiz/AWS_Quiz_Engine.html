<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Premium Quiz Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Glassmorphism Container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            animation: fadeIn 0.8s ease-out;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            background: -webkit-linear-gradient(#ff9900, #ffc107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* File Upload Area */
        .upload-area {
            border: 2px dashed rgba(255, 153, 0, 0.5);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0,0,0,0.2);
        }
        .upload-area:hover {
            border-color: #ff9900;
            background: rgba(255, 153, 0, 0.1);
            transform: scale(1.02);
        }
        .upload-area input {
            display: none;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9900, #ff5e62);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #ff9900;
        }

        /* Question Area */
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .badge {
            background: rgba(255, 153, 0, 0.2);
            color: #ff9900;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 153, 0, 0.4);
        }
        .question-text {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Options */
        .option-label {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }
        .option-label:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
            accent-color: #ff9900;
        }
        .option-label.selected {
            background: rgba(255, 153, 0, 0.2);
            border-color: #ff9900;
        }
        
        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button {
            background: linear-gradient(135deg, #ff9900, #ff8c00);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.5);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Results Dashboard */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .result-card {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .result-card h3 {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        .stat-ring {
            font-size: 2.5rem;
            font-weight: 800;
            color: #00ff88;
        }
        .verdict {
            grid-column: 1 / -1;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
        }
        .verdict.pass {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .verdict.fail {
            background: rgba(255, 94, 98, 0.1);
            border: 1px solid #ff5e62;
            color: #ff5e62;
        }
    </style>
</head>
<body>

<div class="glass-panel" id="setupPanel">
    <h1>AWS Premium Simulator</h1>
    <p style="text-align: center; color: #aaa; margin-bottom: 30px;">
        Esame Cloud Practitioner CLF-C02<br>
        <span style="font-size: 0.9em;">(Nessun server locale richiesto. Funziona offline al 100%)</span>
    </p>

    <label class="upload-area" id="dropZone">
        <input type="file" id="fileInput" accept=".json">
        <div style="font-size: 3rem; margin-bottom: 10px;">📂</div>
        <h3>Trascina qui il file del Quiz</h3>
        <p style="color: #888; margin-top: 5px;">o clicca per selezionare (es. quiz_1.json)</p>
    </label>
</div>

<div class="glass-panel" id="quizPanel" style="display: none;">
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-header">
        <span class="badge" id="domainBadge">Domain</span>
        <span class="badge" id="typeBadge">Type</span>
        <span style="color: #888; font-weight: 600;" id="qCounter">1 / 65</span>
    </div>

    <div class="question-text" id="questionText"></div>
    <div id="optionsContainer"></div>

    <div class="btn-container">
        <button id="prevBtn" onclick="prevQuestion()" style="background: rgba(255,255,255,0.1); color: white; box-shadow: none;">⬅ Precedente</button>
        <button id="nextBtn" onclick="nextQuestion()">Successiva ➡</button>
    </div>
</div>

<div class="glass-panel" id="resultsPanel" style="display: none;">
    <h1>Risultati Ufficiali</h1>
    
    <div id="verdictBox" class="verdict"></div>

    <div class="results-grid" id="statsGrid">
        <div class="result-card" style="grid-column: 1 / -1;">
            <h3>PUNTEGGIO TOTALE</h3>
            <div class="stat-ring" id="finalScore" style="color: #ff9900;">0%</div>
        </div>
        <!-- Domain stats injected here -->
    </div>
    
    <div style="text-align: center; margin-top: 40px;">
        <button onclick="location.reload()">Inizia un Nuovo Quiz</button>
    </div>
</div>

<script>
    let questions = [];
    let currentIdx = 0;
    let userAnswers = {}; // { 0: ['a', 'c'], 1: ['b'] }

    // File Upload Handling
    document.getElementById('fileInput').addEventListener('change', handleFile);
    
    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = JSON.parse(evt.target.result);
                questions = data.results;
                startQuiz();
            } catch (err) {
                alert("Errore: Il file non è un JSON valido.");
            }
        };
        reader.readAsText(file);
    }

    function startQuiz() {
        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('quizPanel').style.display = 'block';
        showQuestion(0);
    }

    function showQuestion(index) {
        const q = questions[index];
        const isMulti = q.assessment_type === 'multi-select';
        
        document.getElementById('domainBadge').innerText = q.section;
        document.getElementById('typeBadge').innerText = isMulti ? "Scelta Multipla" : "Scelta Singola";
        document.getElementById('qCounter').innerText = `${index + 1} / ${questions.length}`;
        document.getElementById('progressBar').style.width = `${((index + 1) / questions.length) * 100}%`;
        
        // Strip out the weird <p> tags from the JSON question text
        document.getElementById('questionText').innerHTML = q.prompt.question;

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        const alphabet = "abcdefghijklmnopqrstuvwxyz";
        const savedAns = userAnswers[index] || [];

        q.prompt.answers.forEach((ans, i) => {
            const letter = alphabet[i];
            const isChecked = savedAns.includes(letter);
            
            const label = document.createElement('label');
            label.className = `option-label ${isChecked ? 'selected' : ''}`;
            label.innerHTML = `
                <input type="${isMulti ? 'checkbox' : 'radio'}" name="option" value="${letter}" ${isChecked ? 'checked' : ''}>
                ${ans.replace(/<p>|<\/p>/g, '')}
            `;
            
            label.querySelector('input').addEventListener('change', () => {
                if(!isMulti) {
                    document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                    userAnswers[index] = [letter];
                } else {
                    if(userAnswers[index] === undefined) userAnswers[index] = [];
                    if(label.querySelector('input').checked) {
                        userAnswers[index].push(letter);
                    } else {
                        userAnswers[index] = userAnswers[index].filter(l => l !== letter);
                    }
                }
                label.classList.toggle('selected');
            });

            optionsContainer.appendChild(label);
        });

        document.getElementById('prevBtn').disabled = index === 0;
        
        const nextBtn = document.getElementById('nextBtn');
        if (index === questions.length - 1) {
            nextBtn.innerText = "Consegna Esame 🏁";
            nextBtn.onclick = finishExam;
        } else {
            nextBtn.innerText = "Successiva ➡";
            nextBtn.onclick = nextQuestion;
        }
    }

    function nextQuestion() {
        if (currentIdx < questions.length - 1) {
            currentIdx++;
            showQuestion(currentIdx);
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            showQuestion(currentIdx);
        }
    }

    function finishExam() {
        document.getElementById('quizPanel').style.display = 'none';
        document.getElementById('resultsPanel').style.display = 'block';

        let correctCount = 0;
        let stats = {};

        questions.forEach((q, idx) => {
            const section = q.section || "Uncategorized";
            if (!stats[section]) stats[section] = { total: 0, correct: 0 };
            stats[section].total++;

            const correctArr = [...q.correct_response].sort();
            const userArr = (userAnswers[idx] || []).sort();

            if (JSON.stringify(correctArr) === JSON.stringify(userArr)) {
                correctCount++;
                stats[section].correct++;
            }
        });

        const totalPercent = Math.round((correctCount / questions.length) * 100);
        document.getElementById('finalScore').innerText = `${totalPercent}%`;
        
        const verdict = document.getElementById('verdictBox');
        if (totalPercent >= 70) {
            verdict.className = 'verdict pass';
            verdict.innerText = "🎉 ESAME SUPERATO! SEI PRONTA.";
            document.getElementById('finalScore').style.color = "#00ff88";
        } else {
            verdict.className = 'verdict fail';
            verdict.innerText = "⚠️ NON SUPERATO. RIPASSA E RIPROVA.";
            document.getElementById('finalScore').style.color = "#ff5e62";
        }

        const grid = document.getElementById('statsGrid');
        for (const [module, data] of Object.entries(stats)) {
            const p = Math.round((data.correct / data.total) * 100);
            const color = p >= 70 ? '#00ff88' : '#ff5e62';
            grid.innerHTML += `
                <div class="result-card">
                    <h3>${module.toUpperCase()}</h3>
                    <div class="stat-ring" style="color: ${color}; font-size: 2rem;">${p}%</div>
                    <div style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">${data.correct} / ${data.total}</div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
