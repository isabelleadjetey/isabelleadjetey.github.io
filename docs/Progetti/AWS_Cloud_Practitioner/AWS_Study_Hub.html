<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Practitioner Study Hub PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap');

        :root {
            --primary: #FF9900; /* AWS Orange */
            --secondary: #d35400; 
            --dark: #232F3E; /* AWS Navy */
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 153, 0, 0.3);
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --text: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #131A22, #232F3E, #131A22);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 40px auto;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        h1, h2, h3 { margin-top: 0; font-weight: 700; }
        .text-center { text-align: center; }
        .text-primary { color: var(--primary); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .module-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255, 153, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .module-card:hover {
            background: rgba(255, 153, 0, 0.1);
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .module-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .module-stats {
            font-size: 14px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        
        .best-score { font-weight: bold; color: #2ecc71; }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 153, 0, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            margin-top: 15px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .domain-badge {
            display: inline-block;
            background: rgba(255, 153, 0, 0.2);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-text p { margin-bottom: 10px; }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-btn p { margin: 0; }

        .option-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .option-btn.selected {
            background: rgba(255, 153, 0, 0.2);
            border-color: var(--primary);
        }

        .option-btn.correct { background: rgba(46, 204, 113, 0.2); border-color: var(--correct); }
        .option-btn.wrong { background: rgba(231, 76, 60, 0.2); border-color: var(--wrong); }

        .explanation {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--primary);
            border-radius: 0 10px 10px 0;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
        
        .explanation img { max-width: 100%; border-radius: 8px; margin-top: 10px; }

        #dashboard-screen, #quiz-screen, #result-screen { display: none; }
        #dashboard-screen { display: block; }
        
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        
        .back-link {
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        .back-link:hover { color: white; }
        
        .instructions {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="dashboard-screen" class="glass-card">
        <div class="text-center">
            <h1 class="text-primary">AWS Cloud Practitioner Study Hub <span style="font-size: 14px; background: white; padding: 2px 6px; border-radius: 4px; color: var(--dark);">PRO</span></h1>
            <p>CLF-C02 | 390 Domande Ufficiali | Spaced Repetition</p>
        </div>
        
        <button class="btn" onclick="startQuiz('All')" style="margin-top: 20px; padding: 15px;">🚀 Full Exam Simulation (65 Domande)</button>

        <h3 style="margin-top: 40px; margin-bottom: 10px;">Domain Drills</h3>
        <div class="dashboard-grid" id="modules-container"></div>
        
        <button class="btn btn-outline" onclick="resetStats()" style="margin-top: 40px; width: auto; font-size: 12px; padding: 8px 15px;">Reset Dati (Scores & Weaknesses)</button>
    </div>

    <div id="quiz-screen" class="glass-card">
        <div class="header-nav">
            <a class="back-link" onclick="goHome()">&larr; Abbandona Test</a>
            <div id="domain-badge" class="domain-badge">Domain</div>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div style="color: #888; font-size: 14px; margin-bottom: 10px;">Domanda <span id="current-q">1</span> di <span id="total-q">10</span></div>
        <div id="q-instructions" class="instructions"></div>
        
        <div id="question-text" class="question-text">Question?</div>
        
        <div id="options-grid" class="options-grid"></div>

        <button id="verify-btn" class="btn" onclick="verifyAnswer()" style="margin-top: 20px;">Verifica Risposta</button>

        <div id="explanation" class="explanation">
            <strong>Spiegazione:</strong> <span id="exp-text"></span>
        </div>

        <button id="next-btn" class="btn" onclick="nextQuestion()" style="display: none; margin-top: 25px;">Prossima Domanda &rarr;</button>
    </div>

    <div id="result-screen" class="glass-card text-center">
        <h1 class="text-primary">Test Completato</h1>
        <h3 id="result-domain" style="color: #aaa;">Domain</h3>
        
        <div style="font-size: 60px; font-weight: bold; margin: 20px 0;">
            <span id="final-score" style="color: white;">0%</span>
        </div>
        <p id="result-msg" style="font-size: 16px; margin-bottom: 40px; color: #ccc;"></p>

        <button class="btn" onclick="goHome()">Torna alla Dashboard</button>
    </div>

</div>

<!-- INCLUSIONE DATABASE AWS -->
<script src="aws_database.js"></script>

<script>
    const domains = [
        "Cloud Concepts",
        "Security and Compliance",
        "Technology",
        "Billing and Pricing"
    ];

    let currentMode = ""; 
    let activeQuizData = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentSelections = [];

    let stats = JSON.parse(localStorage.getItem("aws_stats_pro")) || {};
    let weaknesses = JSON.parse(localStorage.getItem("aws_weaknesses_pro")) || {};

    function initDashboard() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        domains.forEach(d => {
            const best = stats[d] !== undefined ? `${stats[d]}%` : '---';
            const card = document.createElement('div');
            card.className = 'module-card';
            card.onclick = () => startQuiz(d);
            card.innerHTML = `
                <div>
                    <div class="module-title">${d}</div>
                </div>
                <div class="module-stats" style="margin-top: 15px; border-top: 1px solid rgba(255,153,0,0.2); padding-top: 10px;">
                    <span>Best Score:</span>
                    <span class="best-score" style="color: ${stats[d] >= 70 ? '#2ecc71' : (stats[d] >= 50 ? '#f1c40f' : '#e74c3c')}">${best}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function applySpacedRepetition(questionsArray) {
        let enhancedPool = [];
        questionsArray.forEach(q => {
            enhancedPool.push(q);
            if (weaknesses[q.id]) {
                for(let i=0; i<weaknesses[q.id]; i++) {
                    enhancedPool.push(q);
                }
            }
        });
        return enhancedPool;
    }

    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function startQuiz(mode) {
        if (typeof awsDatabase === 'undefined') {
            alert("Errore: Il database AWS non è stato caricato.");
            return;
        }

        currentMode = mode;
        score = 0;
        currentQuestionIndex = 0;
        
        let domainQuestions = (mode === "All") ? awsDatabase : awsDatabase.filter(q => q.domain === mode);
        
        let weightedPool = applySpacedRepetition(domainQuestions);
        weightedPool = shuffleArray(weightedPool);

        let finalSelection = [];
        let numQs = (mode === "All") ? 65 : Math.min(20, domainQuestions.length);
        
        for (let i = 0; i < weightedPool.length && finalSelection.length < numQs; i++) {
            if (!finalSelection.find(q => q.id === weightedPool[i].id)) {
                finalSelection.push(weightedPool[i]);
            }
        }
        activeQuizData = finalSelection;

        document.getElementById('dashboard-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        document.getElementById('domain-badge').innerText = mode === "All" ? "Full Simulation (65 Qs)" : mode;
        document.getElementById('total-q').innerText = activeQuizData.length;
        
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeQuizData[currentQuestionIndex];
        currentSelections = [];
        
        document.getElementById('current-q').innerText = currentQuestionIndex + 1;
        document.getElementById('question-text').innerHTML = q.q;
        
        const isMulti = q.correct.length > 1;
        document.getElementById('q-instructions').innerText = isMulti ? `(Seleziona ${q.correct.length} opzioni)` : `(Seleziona 1 opzione)`;

        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('verify-btn').style.display = 'block';
        
        const progress = (currentQuestionIndex / activeQuizData.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';

        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        let opts = q.options.map((text, index) => ({ text, isCorrect: q.correct.includes(index), originalIndex: index }));
        opts = shuffleArray(opts);

        opts.forEach((opt, renderIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt.text;
            btn.onclick = () => toggleOption(btn, opt, renderIndex, isMulti);
            btn.dataset.renderIndex = renderIndex;
            optionsGrid.appendChild(btn);
        });
        
        // Save rendering order for verification
        q.renderOrder = opts;
    }

    function toggleOption(btn, opt, renderIndex, isMulti) {
        if (!isMulti) {
            // Single select behavior
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            currentSelections = [opt.originalIndex];
            btn.classList.add('selected');
        } else {
            // Multi select behavior
            if (btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                currentSelections = currentSelections.filter(id => id !== opt.originalIndex);
            } else {
                btn.classList.add('selected');
                currentSelections.push(opt.originalIndex);
            }
        }
    }

    function verifyAnswer() {
        const q = activeQuizData[currentQuestionIndex];
        const isMulti = q.correct.length > 1;
        
        if (currentSelections.length !== q.correct.length) {
            alert(`Devi selezionare esattamente ${q.correct.length} opzion${q.correct.length > 1 ? 'i' : 'e'}!`);
            return;
        }

        document.getElementById('verify-btn').style.display = 'none';
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        
        let isTotallyCorrect = true;
        for (let c of q.correct) {
            if (!currentSelections.includes(c)) isTotallyCorrect = false;
        }

        buttons.forEach((b, idx) => {
            const opt = q.renderOrder[idx];
            b.classList.remove('selected');
            
            if (q.correct.includes(opt.originalIndex)) {
                b.classList.add('correct');
            } else if (currentSelections.includes(opt.originalIndex)) {
                b.classList.add('wrong');
            }
        });
        
        if (isTotallyCorrect) {
            score++;
            if (weaknesses[q.id]) {
                weaknesses[q.id]--;
                if(weaknesses[q.id] <= 0) delete weaknesses[q.id];
            }
        } else {
            weaknesses[q.id] = (weaknesses[q.id] || 0) + 1;
        }
        
        localStorage.setItem("aws_weaknesses_pro", JSON.stringify(weaknesses));

        document.getElementById('exp-text').innerHTML = q.exp;
        document.getElementById('explanation').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
        
        if (currentQuestionIndex === activeQuizData.length - 1) {
            document.getElementById('next-btn').innerText = 'Vedi Risultati';
        } else {
            document.getElementById('next-btn').innerText = 'Prossima Domanda \u2192';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const percentage = Math.round((score / activeQuizData.length) * 100);
        
        document.getElementById('result-domain').innerText = currentMode === "All" ? "Full Simulation Completata" : `Drill: ${currentMode}`;
        
        const finalScoreEl = document.getElementById('final-score');
        finalScoreEl.innerText = percentage + '%';
        
        const msgEl = document.getElementById('result-msg');
        if (percentage >= 70) { // AWS Passing score is 700/1000
            finalScoreEl.style.color = '#2ecc71';
            msgEl.innerHTML = "PASS! Sei oltre la soglia di sbarramento (70%).";
        } else {
            finalScoreEl.style.color = '#e74c3c';
            msgEl.innerHTML = "FAIL! Hai bisogno del 70% per passare. Riprova i domini dove hai fatto peggio.";
        }

        if (currentMode !== "All") {
            const prevBest = stats[currentMode] || 0;
            if (percentage > prevBest) {
                stats[currentMode] = percentage;
                localStorage.setItem("aws_stats_pro", JSON.stringify(stats));
            }
        }
    }

    function goHome() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        initDashboard(); 
    }

    function resetStats() {
        if(confirm("Vuoi cancellare lo storico AWS e i dati sulle tue lacune?")) {
            localStorage.removeItem("aws_stats_pro");
            localStorage.removeItem("aws_weaknesses_pro");
            stats = {};
            weaknesses = {};
            initDashboard();
        }
    }

    initDashboard();
</script>
</body>
</html>
